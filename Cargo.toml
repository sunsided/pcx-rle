[package]
name = "pcx-rle"
version = "0.1.0"
edition = "2024"
description = "PCX run-length codec with switchable bugs, the worked example for \"Eight ways to test a decoder\""
keywords = ["pcx", "rle", "run-length", "testing", "fuzzing"]
categories = ["compression", "encoding"]
license = "CC0-1.0"

[features]
# The bugs, one at a time, for the article.
bug-escape = []
bug-cap = []
bug-unchecked = []

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
