[package]
name = "pcx-rle-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.pcx-rle]
path = ".."

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false
bench = false

[features]
bug-escape = ["pcx-rle/bug-escape"]
bug-cap = ["pcx-rle/bug-cap"]
bug-unchecked = ["pcx-rle/bug-unchecked"]
